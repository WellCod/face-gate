name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Backend (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      # O mediapipe traz o OpenCV não-headless, que carrega libGL no import
      - name: Bibliotecas de sistema do OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Dependências de teste
        run: pip install -r backend/requirements-test.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  segredos:
    name: Scan de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
